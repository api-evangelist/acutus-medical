aid: acutus-medical
name: Acutus Medical, Inc.
description: >-
  Acutus Medical, Inc. is a Carlsbad, California arrhythmia-management medical device company
  (SEC CIK 0001522860, SIC 3841 Surgical & Medical Instruments) that built the AcQMap non-contact
  ultrasound-based cardiac imaging and mapping system, the AcQBlate FORCE sensing ablation
  catheter, and the AcQCross and AcQGuide left-heart access family for electrophysiologists
  treating complex cardiac arrhythmias. The company sold its left-heart access portfolio to
  Medtronic beginning in 2022, restructured in November 2023 to solely manufacture and distribute
  that portfolio for Medtronic, and in December 2024 announced an operational downsizing that exited
  the electrophysiology mapping and ablation business and cut roughly 70% of its workforce. Its
  common stock was suspended and delisted from Nasdaq in May 2024, and it filed a Form 15-15D on
  24 January 2025 to suspend its reporting obligations and go dark. Acutus was a device
  manufacturer rather than a software or platform business and never operated a developer program
  or published an API; as of September 2026 its entire public web presence — acutus.com,
  acutusmedical.com and the ir.acutusmedical.com investor site its own press releases link to — no
  longer resolves in DNS, leaving no host on which a contract could be published.
